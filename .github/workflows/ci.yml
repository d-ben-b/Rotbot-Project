name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libs for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: C++ compiler for the firmware simulator (SIL)
        run: g++ --version
      - name: Run tests
        run: pytest -q

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Compile for Arduino Uno（出廠設定 + 全感測設定）
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli compile --fqbn arduino:avr:uno --warnings all firmware/rotbot_mcu
          arduino-cli compile --fqbn arduino:avr:uno --warnings all \
            --build-property "compiler.cpp.extra_flags=-DFLY_HAS_TACH=1 -DFEED_HAS_HOME_SWITCH=1 -DESTOP_SENSE_ENABLED=1 -DVBAT_ENABLED=1" \
            firmware/rotbot_mcu
