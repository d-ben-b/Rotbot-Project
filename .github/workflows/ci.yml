name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libs for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: C++ compiler for the firmware simulator (SIL)
        run: g++ --version
      - name: Run tests
        run: pytest -q

  firmware:
    runs-on: ubuntu-latest
    env:
      # 直接用 raw.githubusercontent.com：2026-11-09 github.com/…/raw/ 這個轉址入口回 504，raw.githubusercontent.com 正常
      ARDUINO_BOARD_MANAGER_ADDITIONAL_URLS: https://raw.githubusercontent.com/stm32duino/BoardManagerFiles/main/package_stmicroelectronics_index.json
      # 版本固定（和筆電上的相同），也當快取的 key；要升級時改這裡
      STM32_CORE: STMicroelectronics:stm32@3.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      # STM32duino 的下載伺服器會回 504（2026-11-09 連兩次）：裝好的套件存成快取，之後的 run 不再下載
      - name: Cache STM32 core (~/.arduino15)
        id: core-cache
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino15-${{ runner.os }}-${{ env.STM32_CORE }}
      - name: Install STM32 core（沒有快取時；下載失敗等一下再試，最多 5 次）
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3 4 5; do
            arduino-cli core update-index && arduino-cli core install "$STM32_CORE" && exit 0
            [ "$i" -lt 5 ] || break
            echo "第 $i 次下載失敗，$((i * 30)) s 後再試"
            sleep $((i * 30))
          done
          echo "::error::STM32 套件下載 5 次都失敗（套件放在 GitHub release，下載伺服器回 504 時等它恢復後重跑）"
          exit 1
      - name: Compile for NUCLEO-G474RE（STM32duino；出廠設定 + 全感測設定）
        run: |
          FQBN=STMicroelectronics:stm32:Nucleo_64:pnum=NUCLEO_G474RE
          arduino-cli compile --fqbn $FQBN --warnings all firmware/rotbot_mcu
          arduino-cli compile --fqbn $FQBN --warnings all \
            --build-property "compiler.cpp.extra_flags=-DFLY_HAS_TACH=1 -DESTOP_SENSE_ENABLED=1 -DVBAT_ENABLED=1" \
            firmware/rotbot_mcu
