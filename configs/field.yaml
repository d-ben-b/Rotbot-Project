# 場地 / 球 / 機構 / 校正 參數（集中管理，所有模組讀這裡）
# 數值來源：presentation/sim_adaptive_calibration.py 的驗證參數。
# 硬體到位後，用實測值覆蓋這個檔即可，程式碼不用動。

field:            # 場地與九宮格幾何（單位：公尺）
  dist_x: 2.50    # 發射點到網框平面的水平距離
  launch_h: 0.50  # 發射口離地高度
  grid_cx: 0.0    # 九宮格中心橫向位置
  grid_cy: 1.50   # 九宮格中心高度
  col_pitch: 0.80 # 行間距（橫向）
  row_pitch: 0.60 # 列間距（垂直）
  frame_d: 0.40   # 一般網框直徑
  bonus_d: 0.20   # 加分格直徑

ball:
  diameter: 0.07  # 球徑 (m)
  mass: 0.030     # 球質量 (kg)

launch:
  v0_model: 10.0  # 機器人「模型認定」的出射速度 (m/s)
  v0_real: 9.60   # 實際出射速度 (m/s) — 飛輪打滑約 4% 損失（硬體到位後量測覆蓋）
  v0_jitter: 0.20 # 逐發初速變異 (m/s, 1σ)

air:              # 空氣阻力（真實世界；機器人內部模型刻意忽略）
  rho: 1.20       # 空氣密度 (kg/m^3)
  cd: 0.50        # 球體阻力係數
  g: 9.81         # 重力加速度

mechanism:        # 機構系統誤差（真實世界存在，模型不知道）
  bias_pitch: -0.40 # 俯仰安裝偏差 (deg)
  bias_yaw: 0.80    # 水平安裝偏差 (deg)
  jitter_deg: 0.40  # 逐發隨機抖動 (deg, 1σ)

calibration:      # 線上自適應校正演算法
  alpha_global: 0.50 # 全域偏移增益
  alpha_cell: 0.30   # 單格殘差增益
  meas_noise_m: 0.02 # 相機落點量測雜訊 (m, 1σ)
  outlier_m: 0.60    # 誤差超過此值視為異常，不更新 (m)
  clamp_deg: 5.0     # 修正量上限 (deg)

camera:           # 相機內參（範例值：1920x1080、水平 FOV≈69°；標定後覆蓋）
  fx: 1400.0
  fy: 1400.0
  cx: 960.0
  cy: 540.0
  width: 1920
  height: 1080

match:
  n_balls: 27     # 一場比賽球數

sim:
  dt: 0.001       # 物理積分步長 (s)
  seed: 42
