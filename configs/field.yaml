# 場地 / 球 / 機構 / 校正 參數（集中管理，所有模組讀這裡）
# 數值來源：presentation/sim_adaptive_calibration.py 的驗證參數；2026-10-25 改為 6m 投球位置。
# 硬體到位後，用實測值覆蓋這個檔即可，程式碼不用動。
# 6m 重新評估的推導與數字：docs/six_meter_reassessment.md

field:            # 場地與九宮格幾何（單位：公尺）— 目標為「圓孔」
  # 孔徑/間距 = 官方「九宮格網框平面尺寸標示圖」實值（公差 ±2cm）：
  #   一般孔 Ø40，邊到邊間距 橫 50 / 縱 20 → 欄距 0.90、列距 0.60
  #   加分孔 Ø20，邊到邊間距 橫 70 / 縱 20 → 欄距 0.90、加分排中心距主頂排 0.50
  #   木板總尺寸 300×340cm；木板與網安裝角約 85°（PnP 會自動量測，不必寫死）
  dist_x: 6.00    # 發射點到網框平面的水平距離（2026-10-25 定為 6m 投球位置；舊值 2.50=檔板處）
  launch_h: 0.40  # 發射口離地高度（依機器人 CAD 反推 ~0.40；待實測，見 configs/robot.yaml）
  grid_cx: 0.0    # 主九宮格中心橫向位置
  grid_cy: 1.80   # 主九宮格中心(中排孔心)離地高：官方正視圖由板底起 60+40+20+60=180cm
                  # （假設板底=地面；舊值 1.50 為猜測）→ 下排 1.20 / 上排 2.40 / 加分排 2.90；待現場確認
  col_pitch: 0.90 # 主九宮格 欄間距（中心距）= 孔徑0.40 + 邊距0.50
  row_pitch: 0.60 # 主九宮格 列間距（中心距）= 孔徑0.40 + 邊距0.20
  frame_d: 0.40   # 一般圓孔直徑（Ø40cm）
  bonus_d: 0.20   # 加分圓孔直徑（Ø20cm，上排 TEL 指定得分格）
  bonus_col_pitch: 0.90  # 上排 3 個加分孔 的欄間距（中心距，與主格對齊）
  bonus_dy: 0.50  # 上排加分孔中心 高於主九宮格最上排中心的距離

ball:
  diameter: 0.07  # 球徑 (m)
  mass: 0.030     # 球質量 (kg)

launch:
  # ⚠️ 6m 設計點（需求值，非實測）：v0≈10 m/s（舊 1700rpm）在 6m 打不到上排與加分孔；
  #    ≥14 m/s 時 v0 抖動造成的落點誤差才夠小（每 0.1 m/s ≈ 2cm）。飛輪 r=6cm 需 ~2400rpm。
  v0_model: 14.0  # 機器人「模型認定」的出射速度 (m/s)
  v0_real: 13.44  # 實際出射速度 (m/s) — 飛輪打滑約 4% 損失（硬體到位後量測覆蓋）
  v0_jitter: 0.20 # 逐發初速變異 (m/s, 1σ) — 6m 最敏感的硬體指標，需實測
  rpm_model: 2400 # v0_model 對應的飛輪轉速 (rpm)；手動操控的預估落點用 v0 = v0_model × 轉速 / rpm_model

air:              # 空氣阻力（真實世界）
  rho: 1.20       # 空氣密度 (kg/m^3)
  cd: 0.50        # 球體阻力係數（真實世界設定值；30g/Ø7cm 泡棉球終端速度 ~16 m/s）
  g: 9.81         # 重力加速度

aim:              # 腦內瞄準模型（決策層用；與上面「真實世界」的落差交給線上校正）
  model: drag     # drag=含平方阻力數值解（6m 必要）；vacuum=無阻力解析解（舊版，6m 會差 8~14°）
  cd_model: 0.45  # 腦內模型認定的阻力係數（刻意與真實 0.50 不同；實機以試投擬合後覆蓋）
  dt: 0.002       # 數值積分步長 (s)

mechanism:        # 機構系統誤差（真實世界存在，模型不知道）
  bias_pitch: -0.40 # 俯仰安裝偏差 (deg)
  bias_yaw: 0.80    # 水平安裝偏差 (deg)
  jitter_deg: 0.40  # 逐發隨機抖動 (deg, 1σ)

calibration:      # 線上自適應校正演算法
  alpha_global: 0.50 # 全域偏移增益
  alpha_cell: 0.30   # 單格殘差增益
  meas_noise_m: 0.02 # 相機落點量測雜訊 (m, 1σ)
  outlier_m: 0.60    # 誤差超過此值視為異常，不更新 (m)
  clamp_deg: 5.0     # 修正量上限 (deg)

camera:           # 模擬/合成影像用的相機模型 = 實機相機「去畸變後」的針孔內參（2026-10-25 起）
                  # 數字取自下面 camera_calib 的輸出：fx=fy=out_f、主點同 cx/cy、解析度同 sensor。
                  # 舊值 1920x1080、fx 1400（水平 69°）是相機定案前的佔位值。
                  # 10/07 刻意不改，是因為 2.5 m 時 6mm 視角只看得到部分孔而認錯孔；6 m 時整面網框都在畫面內（掃視姿態四邊留 ≥ 218 px）。
  fx: 1794.1
  fy: 1794.1
  cx: 777.7
  cy: 578.9
  width: 1456
  height: 1088

camera_calib:     # 實機相機標定（2026-10-07，IMX296 + 6mm 鏡頭）：兩批共 40 張合併，採用 39 張，RMS 0.71 px，四角畸變 129 px
                  # 只有實機相機會讀：影像先去畸變，camera.intrinsics() 回傳去畸變後的針孔內參。
                  # 上面的 camera: 與這裡的去畸變輸出一致（模擬看到的 = 實機去畸變後看到的）。
                  # 換鏡頭或重新對焦後要重跑 tools/calibrate_camera.py 並覆蓋這段（camera: 也要跟著改）。
  width: 1456
  height: 1088
  fx: 1922.6       # 鏡頭原始內參（含畸變）
  fy: 1924.0
  cx: 777.7
  cy: 578.9
  dist: [-0.50801, 0.26907, -0.00161, 0.00006, 0.0]   # k1, k2, p1, p2, k3
  out_f: 1794.1    # 去畸變後影像的焦距（fx=fy）；視角 44.2°×33.7°

camera_hw:        # 實體相機的擷取設定（只有實機會讀；模擬/合成資料不受影響）
  backend: imx296       # imx296 = Raspberry Pi Global Shutter Camera（Jetson CSI）；webcam = USB 鏡頭
  device: /dev/video0   # webcam 時填裝置編號（如 "0"）
  exposure_us: 8333     # 曝光 (µs)，15–15700。8333 在 60Hz 市電燈光下不閃；追高速球要縮到約 250（1/4000s）
  gain_db: 0.0          # 類比增益 (dB)，0–48。每 +6dB 亮度加倍、雜訊也變多；先開大光圈再加 gain
  wb_r: 3.05            # 白平衡增益（相對綠色）。預設＝sensor 標定資料 4640K；現場用
  wb_b: 1.85            #   tools/camera_check.py --auto-wb 對著白紙量一次再覆蓋
  ccm: true             # 套用色彩校正矩陣：顏色較準（紅色 LED 較飽和），但較慢
  undistort_interp: nearest   # 去畸變的內插：nearest（約 3 ms）| linear（約 18 ms，邊緣較平滑）

camera_mount:     # 相機相對「發射點」的外參（⚠️ 全 0=相機在發射口且對齊，待實機標定 P5）
  dx: 0.0         # 右 (m)
  dy: 0.0         # 上 (m)，相機高於發射口為正
  dz: 0.0         # 前 (m)
  roll: 0.0       # 繞前軸 (deg)
  pitch: 0.0      # 繞右軸 (deg)，相機上仰為正
  yaw: 0.0        # 繞上軸 (deg)

match:
  n_balls: 27     # 一場比賽球數

sim:
  dt: 0.001       # 物理積分步長 (s)
  seed: 42
