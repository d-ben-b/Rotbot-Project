[project]
name = "rotbot"
version = "0.1.0"
description = "AI 自主棒球投手機器人 —— 軟體端（感知/決策/致動）"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# 硬體到位後 (P5) 才需要：
hardware = ["pyserial>=3.5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["rotbot*"]
